name: Build TV Hub Desktop
on:
  workflow_dispatch:
  push:
    paths: ['app/**', '.github/workflows/desktop.yml']
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - name: Build
        run: npx electron-builder --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: TV-Hub-${{ matrix.os }}
          path: |
            app/dist/*.exe
            app/dist/*.AppImage
